name: Maritime Biosecurity ETL Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push updated JSON back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ETL Script
        run: python etl_pipeline.py

      - name: Commit and Push Processed JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline_risk.json
          if git diff --staged --quiet; then
            echo "No changes in generated data."
          else
            git commit -m "chore(data): update baseline_risk.json [skip ci]"
            git push
          fi
