name: GFW Biosecurity Data Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Sync Script
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: python scripts/process_port_risks.py

      - name: Commit and Push Updated Risk Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline_risk.json config/
          git diff --staged --quiet || (git commit -m "chore: automated GFW biosecurity data sync" && git push)
