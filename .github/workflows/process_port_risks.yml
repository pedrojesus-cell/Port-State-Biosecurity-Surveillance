name: Shipsonic Biosecurity Risk Processing

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:      # Allows manual trigger in the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas shapely numpy

      - name: Fetch GFW API & Process Biosecurity Data
        env:
          GFW_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: |
          python scripts/process_port_risks.py

      - name: Commit and Push Updated Baseline Output
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/baseline_risk.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update baseline biosecurity risk dataset"
          git push
