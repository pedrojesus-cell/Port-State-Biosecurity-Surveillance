name: Process Port Biosecurity Risks

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  push:
    paths:
      - 'config/*.csv'
      - 'scripts/*.py'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy

      - name: Run Biosecurity Risk Engine
        run: |
          python scripts/process_port_risks.py

      - name: Commit and Push Baseline JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/baseline_risk.json
          git diff-index --quiet HEAD || git commit -m "auto: update baseline risk data [skip ci]"
          git push
