name: Shipsonic Biosecurity Risk Processing

on:
  schedule:
    - cron: '0 0 * * *'  # Trigger daily at midnight
  workflow_dispatch:      # Enable manual triggers

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Spatial & Data Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas shapely numpy

      - name: Execute Risk Engine
        run: |
          python scripts/process_port_risks.py

      - name: Commit and Push Updated Baseline Output
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/baseline_risk.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update baseline biosecurity risk dataset"
          git push
