<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shipsonic - Port-State Biosecurity Surveillance</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    #header { padding: 16px 24px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    #container { display: flex; height: calc(100vh - 65px); }
    #map { flex: 2; height: 100%; }
    #sidebar { flex: 1; max-width: 420px; background: #1e293b; border-left: 1px solid #334155; overflow-y: auto; padding: 20px; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }
    .high { background: #991b1b; color: #fecaca; }
    .moderate { background: #854d0e; color: #fef08a; }
    .low { background: #166534; color: #bbf7d0; }
  </style>
</head>
<body>

  <div id="header">
    <h2>🚢 Shipsonic Maritime Biosecurity Dashboard</h2>
    <span id="timestamp">Loading updates...</span>
  </div>

  <div id="container">
    <div id="map"></div>
    <div id="sidebar">
      <h3>Vessel Risk Profile</h3>
      <div id="vessel-list">Select a vessel pin on the map to inspect fouling metrics...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    function getBadgeClass(category) {
      if (category === 'High Fouling Risk') return 'high';
      if (category === 'Moderate Vector') return 'moderate';
      return 'low';
    }

    async function loadRiskData() {
      try {
        const response = await fetch('../data/baseline_risk.json');
        const data = await response.json();
        document.getElementById('timestamp').innerText = `Updated: ${new Date(data.generated_at).toLocaleString()}`;

        data.vessels.forEach(vessel => {
          const color = vessel.risk_score >= 0.7 ? '#ef4444' : vessel.risk_score >= 0.35 ? '#eab308' : '#22c55e';
          
          const marker = L.circleMarker([vessel.latitude, vessel.longitude], {
            radius: 8,
            fillColor: color,
            color: '#ffffff',
            weight: 1,
            fillOpacity: 0.85
          }).addTo(map);

          marker.on('click', () => {
            document.getElementById('vessel-list').innerHTML = `
              <div class="card">
                <h4>${vessel.vessel_name} <small>(${vessel.flag})</small></h4>
                <p><strong>MMSI:</strong> ${vessel.mmsi}</p>
                <p><strong>Port/EEZ:</strong> ${vessel.port_name}</p>
                <p><strong>Residence Time:</strong> ${vessel.residence_hours} hrs</p>
                <p><strong>MGPS Active:</strong> ${vessel.mgps_installed ? 'Yes ✅' : 'No ❌'}</p>
                <hr style="border-color: #334155;" />
                <p><strong>Risk Rating:</strong> 
                  <span class="badge ${getBadgeClass(vessel.risk_category)}">${vessel.risk_category}</span>
                </p>
                <p><strong>Score:</strong> ${vessel.risk_score} / 1.0</p>
              </div>
            `;
          });
        });
      } catch (err) {
        console.error("Failed loading biosecurity risk dataset:", err);
      }
    }

    loadRiskData();
  </script>
</body>
</html>
